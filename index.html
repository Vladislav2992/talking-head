<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaking man</title>
  <link rel="stylesheet" href="style/style.css">
  <script src="js/app.js" type="module" defer></script>
</head>
<body>
  <div class="container">
    <div class="head">
      <div class="eyebrows">
        <div class="eyebrow"></div>
        <div class="eyebrow"></div>
      </div>
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>

      <div class="nose"></div>
      <div class="mouth">
        <div class="tooth"></div>
      </div>
      <div class="text-buble">
        <span class="text"></span>
      </div>
    </div>

    <form action="" id="message">
      <select name="" id="lang">
        <option value="ru">Русский</option>
        <option value="es">Español</option>
      </select>
      <input type="range" name="" id="speed" value="150" min="100" max="300" step="10">
      <input type="text" id="text" class="message-input">
    </form>
  </div>

</body>
</html>
